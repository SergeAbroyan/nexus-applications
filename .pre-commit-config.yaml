repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'unformatted="$(gofmt -l services/api)"; [[ -z "${unformatted}" ]] || { echo "${unformatted}"; exit 1; }'
        language: system
        files: ^services/api/.+\.go$
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: bash -c 'cd services/api && go vet ./... && go vet -tags integration ./...'
        language: system
        files: ^services/api/.+\.go$
        pass_filenames: false
