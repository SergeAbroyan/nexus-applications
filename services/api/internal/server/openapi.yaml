openapi: 3.0.3
info:
  title: Nexus API
  version: 1.0.0
  description: Items stored in PostgreSQL and notifications queued for the Nexus worker.
servers:
  - url: /
paths:
  /api/items:
    get:
      operationId: listItems
      summary: List every item, read through the Valkey cache
      responses:
        "200":
          description: The items and where they were read from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createItem
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItem"
      responses:
        "201":
          description: The created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /api/notify:
    post:
      operationId: requestNotification
      summary: Queue a notification for the worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationRequest"
      responses:
        "202":
          description: The notification is queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queued"
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/version:
    get:
      operationId: getVersion
      summary: The commit the running image was built from
      responses:
        "200":
          description: The version of this API instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /api/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This document
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema:
                type: object
components:
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Item:
      type: object
      additionalProperties: false
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 200
        createdAt:
          type: string
          format: date-time
    ItemList:
      type: object
      additionalProperties: false
      required: [items, source]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        source:
          type: string
          enum: [cache, database]
    NewItem:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    NotificationRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
    Queued:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [queued]
    Version:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          minLength: 1
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
