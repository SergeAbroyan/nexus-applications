<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nexus Platform</title>
    <script src="/app.js" defer></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #10131a;
        color: #f4f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(42rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid #2b3445;
        border-radius: 1rem;
        background: #171c26;
      }

      form {
        display: flex;
        gap: 0.75rem;
      }

      input, button {
        padding: 0.75rem 1rem;
        border: 1px solid #3d485d;
        border-radius: 0.5rem;
        font: inherit;
      }

      input {
        flex: 1;
        background: #0d1016;
        color: inherit;
      }

      button {
        border: 0;
        background: #64d8cb;
        color: #0b1716;
        cursor: pointer;
        font-weight: 700;
      }

      pre {
        min-height: 5rem;
        padding: 1rem;
        overflow: auto;
        border-radius: 0.5rem;
        background: #0d1016;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Nexus</p>
      <h1>Nexus Platform</h1>
      <p>The Go API serves this page and stores items. A Java worker processes queued notifications.</p>
      <form id="create-item">
        <input id="item-name" name="name" placeholder="Item name" maxlength="200" required>
        <button type="submit">Add item</button>
      </form>
      <p><button id="load-items" type="button">Load items</button></p>
      <pre id="result" aria-live="polite">No request sent yet.</pre>
    </main>
  </body>
</html>
