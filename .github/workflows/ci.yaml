name: Application CI and ECR Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ECR_NAMESPACE: nexus
  GITOPS_REPOSITORY: SergeAbroyan/nexus-gitops

jobs:
  quality:
    name: Test and code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet packages
        run: go vet ./...

      - name: Verify module files
        run: go mod tidy -diff

      - name: Run tests with race detection and coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Analyze with SonarQube
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.3.0

      - name: Enforce SonarQube Quality Gate
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 300

  containers:
    name: Validate ${{ matrix.service }} image
    if: >-
      github.event_name == 'pull_request' ||
      vars.AWS_ROLE_ARN == '' ||
      vars.AWS_REGION == ''
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nexus-${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish:
    name: Publish ${{ matrix.service }}
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != ''
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check whether image already exists
        id: image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY: ${{ env.ECR_NAMESPACE }}/${{ matrix.service }}
        run: |
          if aws ecr describe-images --repository-name "${REPOSITORY}" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nexus-${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan release image
        if: steps.image.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push verified image to ECR
        if: steps.image.outputs.exists == 'false'
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
        run: docker push "${IMAGE_URI}"

      - name: Record ECR image
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          REPOSITORY: ${{ env.ECR_NAMESPACE }}/${{ matrix.service }}
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "\`${IMAGE_URI}@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  promote-dev:
    name: Promote release to DEV
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != ''
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Record skipped promotion
        if: env.GITOPS_TOKEN == ''
        run: echo "DEV promotion skipped because GITOPS_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out GitOps repository
        if: env.GITOPS_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: main
          path: nexus-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update DEV release tag
        if: env.GITOPS_TOKEN != ''
        working-directory: nexus-gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for values_file in \
            environments/dev/frontend-values.yaml \
            environments/dev/api-values.yaml \
            environments/dev/worker-values.yaml; do
            sed -i -E "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" "${values_file}"
            grep -Fx "  tag: \"${IMAGE_TAG}\"" "${values_file}"
          done

      - name: Commit and push DEV promotion
        if: env.GITOPS_TOKEN != ''
        working-directory: nexus-gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          DEV_VALUE_FILES=(
            environments/dev/frontend-values.yaml
            environments/dev/api-values.yaml
            environments/dev/worker-values.yaml
          )
          if git diff --quiet -- "${DEV_VALUE_FILES[@]}"; then
            echo "DEV already uses ${IMAGE_TAG}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DEV_VALUE_FILES[@]}"
          git commit -m "deploy(dev): ${IMAGE_TAG}"
          git push origin HEAD:main
          echo "Promoted DEV to \`${IMAGE_TAG}\`." >> "$GITHUB_STEP_SUMMARY"
