name: Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Test and code quality
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet packages
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Measure test coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Analyze with SonarQube
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.3.0

      - name: Enforce SonarQube Quality Gate
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 300

  containers:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          tags: nexus/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexus/${{ matrix.service }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish:
    name: Publish ${{ matrix.service }}
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != ''
    needs: [quality, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check whether image already exists
        id: image
        run: |
          if aws ecr describe-images --repository-name "nexus/${{ matrix.service }}" --image-ids "imageTag=${{ github.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/nexus/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record published image
        run: echo '`${{ steps.ecr.outputs.registry }}/nexus/${{ matrix.service }}:${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
