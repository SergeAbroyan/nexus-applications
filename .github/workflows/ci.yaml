name: Application CI and ECR Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ECR_NAMESPACE: nexus
  GITOPS_REPOSITORY: SergeAbroyan/nexus-gitops

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    outputs:
      api: ${{ steps.services.outputs.api }}
      worker: ${{ steps.services.outputs.worker }}
      any: ${{ steps.services.outputs.any }}
      matrix: ${{ steps.services.outputs.matrix }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check out DEV release state
        if: github.event_name == 'push' && env.GITOPS_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: main
          path: nexus-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          persist-credentials: false
          sparse-checkout: environments/dev

      - name: Select affected services
        id: services
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          affected_services() {
            while IFS= read -r path; do
              case "${path}" in
                services/api/*|services/observability/*|go.mod|go.sum)
                  echo api
                  ;;
                services/worker/*)
                  echo worker
                  ;;
                .dockerignore|Makefile|compose.yaml|sonar-project.properties|.github/workflows/ci.yaml)
                  echo api
                  echo worker
                  ;;
              esac
            done
          }

          deployed_commit() {
            local tag
            tag="$(sed -nE 's/^  tag: "?([0-9a-f]{40})"?$/\1/p' "nexus-gitops/environments/dev/$1-values.yaml")"
            if [[ -n "${tag}" ]] && git cat-file -e "${tag}^{commit}" 2>/dev/null; then
              echo "${tag}"
            fi
          }

          services=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            services=$'api\nworker'
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            services="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | affected_services)"
          elif [[ -d nexus-gitops/environments/dev ]]; then
            for service in api worker; do
              deployed="$(deployed_commit "${service}")"
              if [[ -z "${deployed}" ]]; then
                services+=$'\n'"${service}"
                continue
              fi
              changed="$(git diff --name-only "${deployed}" HEAD | affected_services)"
              if grep -qx "${service}" <<< "${changed}"; then
                services+=$'\n'"${service}"
              fi
            done
          elif [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            services="$(git show --pretty='' --name-only HEAD | affected_services)"
          else
            services="$(git diff --name-only "${BEFORE_SHA}" HEAD | affected_services)"
          fi

          api=false
          worker=false
          if grep -qx api <<< "${services}"; then
            api=true
          fi
          if grep -qx worker <<< "${services}"; then
            worker=true
          fi

          if [[ "${api}" == "true" && "${worker}" == "true" ]]; then
            matrix='["api","worker"]'
          elif [[ "${api}" == "true" ]]; then
            matrix='["api"]'
          elif [[ "${worker}" == "true" ]]; then
            matrix='["worker"]'
          else
            matrix='[]'
          fi

          any=true
          if [[ "${matrix}" == '[]' ]]; then
            any=false
          fi

          {
            echo "api=${api}"
            echo "worker=${worker}"
            echo "any=${any}"
            echo "matrix=${matrix}"
          } >> "${GITHUB_OUTPUT}"

  quality:
    name: Test changed services
    if: needs.changes.outputs.any == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Go
        if: >-
          needs.changes.outputs.api == 'true' ||
          (env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '')
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify formatting
        if: >-
          needs.changes.outputs.api == 'true' ||
          (env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '')
        run: test -z "$(gofmt -l .)"

      - name: Vet packages
        if: >-
          needs.changes.outputs.api == 'true' ||
          (env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '')
        run: go vet ./...

      - name: Verify module files
        if: >-
          needs.changes.outputs.api == 'true' ||
          (env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '')
        run: go mod tidy -diff

      - name: Run tests with race detection and coverage
        if: >-
          needs.changes.outputs.api == 'true' ||
          (env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '')
        run: go test -race -coverprofile=coverage.out ./...

      - name: Install Java
        if: >-
          needs.changes.outputs.worker == 'true' ||
          (env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '')
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/worker/pom.xml

      - name: Test Java worker
        if: >-
          needs.changes.outputs.worker == 'true' ||
          (env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '')
        run: mvn -B -f services/worker/pom.xml verify

      - name: Analyze with SonarQube
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9

      - name: Enforce SonarQube Quality Gate
        if: env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        with:
          pollingTimeoutSec: 300

  containers:
    name: Validate ${{ matrix.service }} image
    if: >-
      needs.changes.outputs.any == 'true' &&
      (github.event_name == 'pull_request' ||
      vars.AWS_ROLE_ARN == '' ||
      vars.AWS_REGION == '')
    needs: [changes, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build container
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nexus-${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish:
    name: Publish ${{ matrix.service }}
    if: >-
      needs.changes.outputs.any == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != ''
    needs: [changes, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Check whether image already exists
        id: image
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY: ${{ env.ECR_NAMESPACE }}/${{ matrix.service }}
        run: |
          if aws ecr describe-images --repository-name "${REPOSITORY}" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nexus-${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan release image
        if: steps.image.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push verified image to ECR
        if: steps.image.outputs.exists == 'false'
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
        run: docker push "${IMAGE_URI}"

      - name: Record ECR image
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          REPOSITORY: ${{ env.ECR_NAMESPACE }}/${{ matrix.service }}
        run: |
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          echo "\`${IMAGE_URI}@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  promote-dev:
    name: Promote release to DEV
    if: >-
      needs.changes.outputs.any == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != ''
    needs: [changes, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Record skipped promotion
        if: env.GITOPS_TOKEN == ''
        run: echo "DEV promotion skipped because GITOPS_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out GitOps repository
        if: env.GITOPS_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: main
          path: nexus-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Update DEV release tag
        if: env.GITOPS_TOKEN != ''
        working-directory: nexus-gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
        run: |
          DEV_VALUE_FILES=()
          if [[ "${API_CHANGED}" == "true" ]]; then
            DEV_VALUE_FILES+=(environments/dev/api-values.yaml)
          fi
          if [[ "${WORKER_CHANGED}" == "true" ]]; then
            DEV_VALUE_FILES+=(environments/dev/worker-values.yaml)
          fi

          for values_file in "${DEV_VALUE_FILES[@]}"; do
            sed -i -E "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" "${values_file}"
            grep -Fx "  tag: \"${IMAGE_TAG}\"" "${values_file}"
          done

      - name: Commit and push DEV promotion
        if: env.GITOPS_TOKEN != ''
        working-directory: nexus-gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
        run: |
          DEV_VALUE_FILES=()
          if [[ "${API_CHANGED}" == "true" ]]; then
            DEV_VALUE_FILES+=(environments/dev/api-values.yaml)
          fi
          if [[ "${WORKER_CHANGED}" == "true" ]]; then
            DEV_VALUE_FILES+=(environments/dev/worker-values.yaml)
          fi

          if git diff --quiet -- "${DEV_VALUE_FILES[@]}"; then
            echo "DEV already uses ${IMAGE_TAG}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${DEV_VALUE_FILES[@]}"
          git commit -m "deploy(dev): ${IMAGE_TAG}"
          git push origin HEAD:main
          echo "Promoted DEV to \`${IMAGE_TAG}\`." >> "$GITHUB_STEP_SUMMARY"
