name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITOPS_REPOSITORY: ${{ github.repository_owner }}/nexus-gitops

jobs:
  secrets:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan the history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"

  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    outputs:
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out DEV release state
        if: github.event_name == 'push' && env.GITOPS_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: main
          path: nexus-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          persist-credentials: false
          sparse-checkout: environments/dev

      - name: Select changed services
        id: services
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          services_in() {
            while IFS= read -r path; do
              case "${path}" in
                services/api/*) echo api ;;
                services/worker/*) echo worker ;;
                contracts/*) printf '%s\n' api worker ;;
                .github/workflows/ci.yaml) printf '%s\n' api worker ;;
              esac
            done
          }

          deployed_commit() {
            local tag
            tag="$(sed -nE 's/^  tag: "?([0-9a-f]{40})"?$/\1/p' "nexus-gitops/environments/dev/$1-values.yaml")"
            if [[ -n "${tag}" ]] && git cat-file -e "${tag}^{commit}" 2>/dev/null; then
              echo "${tag}"
            fi
          }

          services=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            services=$'api\nworker'
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            services="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | services_in)"
          elif [[ -d nexus-gitops/environments/dev ]]; then
            for service in api worker; do
              deployed="$(deployed_commit "${service}")"
              if [[ -z "${deployed}" ]]; then
                services+=$'\n'"${service}"
              elif grep -qx "${service}" <<< "$(git diff --name-only "${deployed}" HEAD | services_in)"; then
                services+=$'\n'"${service}"
              fi
            done
          elif [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            services="$(git show --pretty='' --name-only HEAD | services_in)"
          else
            services="$(git diff --name-only "${BEFORE_SHA}" HEAD | services_in)"
          fi

          echo "services=$(jq -cnR '[inputs | select(length > 0)] | unique' <<< "${services}")" >> "${GITHUB_OUTPUT}"

  api:
    name: Test API
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'api')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "Run gofmt -w on: ${unformatted}" >&2
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

      - name: Test against PostgreSQL, Valkey, and ElasticMQ containers
        run: go test -race -tags integration ./...

  worker:
    name: Test worker
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'worker')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/worker
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/worker/pom.xml

      - name: Build, test, and run the ElasticMQ integration test
        run: mvn -B -ntp verify

  sonar:
    name: SonarQube analysis
    needs: changes
    if: vars.SONAR_HOST_URL != '' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Measure API coverage
        working-directory: services/api
        run: go test -tags integration -coverprofile=coverage.out ./...

      - name: Install Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: services/worker/pom.xml

      - name: Measure worker coverage
        working-directory: services/worker
        run: mvn -B -ntp verify

      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

      - name: Enforce the quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        with:
          pollingTimeoutSec: 300

  image:
    name: Image ${{ matrix.service }}
    needs: [secrets, changes, api, worker, sonar]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' }}
      REPOSITORY: nexus/${{ matrix.service }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        if: env.RELEASE == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        if: env.RELEASE == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Name the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          exists=false
          if [[ "${RELEASE}" == "true" ]]; then
            name="${REGISTRY}/${REPOSITORY}:${GITHUB_SHA}"
            if aws ecr describe-images --repository-name "${REPOSITORY}" --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
              exists=true
            fi
          else
            name="${REPOSITORY}:${GITHUB_SHA}"
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "exists=${exists}" >> "${GITHUB_OUTPUT}"

      - name: Configure Docker Buildx
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nexus-${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for vulnerabilities
        if: steps.image.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push image to ECR
        if: env.RELEASE == 'true' && steps.image.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "${IMAGE}"

      - name: Record image digest
        if: env.RELEASE == 'true'
        id: digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${REGISTRY}/${REPOSITORY}@${digest}" >> "${GITHUB_OUTPUT}"
          echo "\`${IMAGE}@${digest}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Attest build provenance
        if: env.RELEASE == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: env.RELEASE == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign image
        if: env.RELEASE == 'true'
        env:
          REFERENCE: ${{ steps.digest.outputs.reference }}
        run: cosign sign --yes "${REFERENCE}"

      - name: Generate SBOM
        if: env.RELEASE == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.digest.outputs.reference }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      - name: Attest SBOM
        if: env.RELEASE == 'true'
        env:
          REFERENCE: ${{ steps.digest.outputs.reference }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${REFERENCE}"
          echo "Signed with the identity of this workflow and attested an SPDX SBOM." >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote to DEV
    needs: [changes, image]
    if: >-
      !cancelled() &&
      needs.image.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Record skipped promotion
        if: env.GITOPS_TOKEN == ''
        run: echo "DEV promotion skipped because GITOPS_TOKEN is not configured." >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out GitOps repository
        if: env.GITOPS_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: main
          path: nexus-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Point DEV at the new images
        if: env.GITOPS_TOKEN != ''
        working-directory: nexus-gitops
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          set -euo pipefail

          files=()
          for service in $(jq -r '.[]' <<< "${SERVICES}"); do
            file="environments/dev/${service}-values.yaml"
            sed -i -E "s/^  tag: .*/  tag: \"${GITHUB_SHA}\"/" "${file}"
            grep -Fqx "  tag: \"${GITHUB_SHA}\"" "${file}"
            files+=("${file}")
          done

          if git diff --quiet -- "${files[@]}"; then
            echo "DEV already runs ${GITHUB_SHA}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "deploy(dev): ${GITHUB_SHA}" -- "${files[@]}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Promoted DEV to \`${GITHUB_SHA}\`." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "Push attempt ${attempt} was rejected; rebasing on the latest GitOps commit." >&2
            git pull --rebase origin main
          done
          exit 1
