name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITOPS_REPOSITORY: SergeAbroyan/nexus-gitops

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    outputs:
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check out DEV release state
        if: github.event_name == 'push' && env.GITOPS_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: main
          path: nexus-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          persist-credentials: false
          sparse-checkout: environments/dev

      - name: Select changed services
        id: services
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          services_in() {
            while IFS= read -r path; do
              case "${path}" in
                services/api/*) echo api ;;
                services/worker/*) echo worker ;;
                .github/workflows/ci.yaml) printf '%s\n' api worker ;;
              esac
            done
          }

          deployed_commit() {
            local tag
            tag="$(sed -nE 's/^  tag: "?([0-9a-f]{40})"?$/\1/p' "nexus-gitops/environments/dev/$1-values.yaml")"
            if [[ -n "${tag}" ]] && git cat-file -e "${tag}^{commit}" 2>/dev/null; then
              echo "${tag}"
            fi
          }

          services=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            services=$'api\nworker'
          elif [[ "${EVENT_NAME}" == "pull_request" ]]; then
            services="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" | services_in)"
          elif [[ -d nexus-gitops/environments/dev ]]; then
            for service in api worker; do
              deployed="$(deployed_commit "${service}")"
              if [[ -z "${deployed}" ]]; then
                services+=$'\n'"${service}"
              elif grep -qx "${service}" <<< "$(git diff --name-only "${deployed}" HEAD | services_in)"; then
                services+=$'\n'"${service}"
              fi
            done
          elif [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
            services="$(git show --pretty='' --name-only HEAD | services_in)"
          else
            services="$(git diff --name-only "${BEFORE_SHA}" HEAD | services_in)"
          fi

          echo "services=$(jq -cnR '[inputs | select(length > 0)] | unique' <<< "${services}")" >> "${GITHUB_OUTPUT}"

  api:
    name: Test API
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'api')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "Run gofmt -w on: ${unformatted}" >&2
            exit 1
          fi

      - name: Check module files
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race ./...

  worker:
    name: Test worker
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'worker')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/worker
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/worker/pom.xml

      - name: Build and test
        run: mvn -B -ntp verify

  sonar:
    name: SonarQube analysis
    needs: changes
    if: vars.SONAR_HOST_URL != '' && needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: Measure API coverage
        working-directory: services/api
        run: go test -coverprofile=coverage.out ./...

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/worker/pom.xml

      - name: Measure worker coverage
        working-directory: services/worker
        run: mvn -B -ntp verify

      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9

      - name: Enforce the quality gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        with:
          pollingTimeoutSec: 300

  image:
    name: Image ${{ matrix.service }}
    needs: [changes, api, worker, sonar]
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' }}
      REPOSITORY: nexus/${{ matrix.service }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure AWS credentials
        if: env.RELEASE == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to Amazon ECR
        if: env.RELEASE == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Name the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          exists=false
          if [[ "${RELEASE}" == "true" ]]; then
            name="${REGISTRY}/${REPOSITORY}:${GITHUB_SHA}"
            if aws ecr describe-images --repository-name "${REPOSITORY}" --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
              exists=true
            fi
          else
            name="${REPOSITORY}:${GITHUB_SHA}"
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "exists=${exists}" >> "${GITHUB_OUTPUT}"

      - name: Configure Docker Buildx
        if: steps.image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=nexus-${{ matrix.service }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for vulnerabilities
        if: steps.image.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.image.outputs.name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push image to ECR
        if: env.RELEASE == 'true' && steps.image.outputs.exists == 'false'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "${IMAGE}"

      - name: Record image digest
        if: env.RELEASE == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          digest="$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          echo "\`${IMAGE}@${digest}\`" >> "${GITHUB_STEP_SUMMARY}"

  promote:
    name: Promote to DEV
    needs: [changes, image]
    if: >-
      !cancelled() &&
      needs.image.result == 'success' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_ROLE_ARN != '' &&
      vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Record skipped promotion
        if: env.GITOPS_TOKEN == ''
        run: echo "DEV promotion skipped because GITOPS_TOKEN is not configured." >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out GitOps repository
        if: env.GITOPS_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: main
          path: nexus-gitops
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Point DEV at the new images
        if: env.GITOPS_TOKEN != ''
        working-directory: nexus-gitops
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          set -euo pipefail

          files=()
          for service in $(jq -r '.[]' <<< "${SERVICES}"); do
            file="environments/dev/${service}-values.yaml"
            sed -i -E "s/^  tag: .*/  tag: \"${GITHUB_SHA}\"/" "${file}"
            grep -Fqx "  tag: \"${GITHUB_SHA}\"" "${file}"
            files+=("${file}")
          done

          if git diff --quiet -- "${files[@]}"; then
            echo "DEV already runs ${GITHUB_SHA}." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "deploy(dev): ${GITHUB_SHA}" -- "${files[@]}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Promoted DEV to \`${GITHUB_SHA}\`." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            echo "Push attempt ${attempt} was rejected; rebasing on the latest GitOps commit." >&2
            git pull --rebase origin main
          done
          exit 1
