name: Security scan

on:
  pull_request:
    branches: [main]
    paths:
      - services/api/**
      - compose.yaml
      - .zap/**
      - .github/workflows/dast.yaml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: Address to scan, such as https://nexus-dev.example.com; leave empty to scan the Compose stack
        required: false
        default: ""
        type: string

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0

jobs:
  zap:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the Compose stack
        if: env.TARGET == ''
        run: docker compose up --build --wait --quiet-pull

      - name: Scan with the project rules
        run: |
          set -euo pipefail
          mkdir -p zap
          cp .zap/rules.tsv zap/
          chmod -R a+rwX zap
          if [[ -n "${TARGET}" ]]; then
            network=bridge
            target="${TARGET}"
          else
            network=nexus_default
            target=http://api:8080
          fi
          docker run --rm --network "${network}" -v "${PWD}/zap:/zap/wrk:rw" "${ZAP_IMAGE}" \
            zap-baseline.py -t "${target}" -c rules.tsv -r report.html -J report.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: |
            zap/report.html
            zap/report.json
          if-no-files-found: ignore

      - name: Stop the Compose stack
        if: always() && env.TARGET == ''
        run: docker compose down --volumes
