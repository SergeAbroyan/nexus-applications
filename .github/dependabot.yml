version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /services/worker
    schedule:
      interval: weekly
      day: monday
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/api
      - /services/worker
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      local-stack:
        patterns: ["*"]
