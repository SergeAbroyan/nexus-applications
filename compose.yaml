name: nexus

x-local-aws: &local-aws
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  AWS_ENDPOINT_URL_SQS: http://sqs:9324
  SQS_QUEUE_URL: http://sqs:9324/000000000000/nexus-dev-jobs

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: &database-password nexus-local-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8.1.10-alpine3.24
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro

  api:
    build: services/api
    environment:
      <<: *local-aws
      DB_HOST: postgres
      DB_PASSWORD: *database-password
      VALKEY_HOST: valkey
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      sqs:
        condition: service_started
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: services/worker
    environment:
      <<: *local-aws
      SQS_WAIT_TIME_SECONDS: 2
    depends_on:
      sqs:
        condition: service_started

volumes:
  postgres-data:
